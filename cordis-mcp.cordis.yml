# MCP patch — exposes the bundled `dsh-memory-amem` MCP server to DSH.
# Drop into DSH via:
#   dsh web --patch "$PWD/dsh-memory-amem/cordis-mcp.cordis.yml"
#
# Requires Node 22+ and the mcp/ subdirectory to be built
# (cd mcp && npm install && pnpm run build).

- insert:
    - id: memory-amem-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dsh_memory_amem
        transport: stdio
        command: node
        args:
          - !!js >-
            process.getBuiltinModule('node:path').resolve(
              process.getBuiltinModule('node:url').pathToFileURL(
                process.env.DSH_MEMORY_AMEM_DIR ||
                '/absolute/path/to/dsh-memory-amem'
              ).pathname,
              'mcp/build/index.js'
            )
        env:
          DEEPSEEK_API_KEY: !!js "process.env.DEEPSEEK_API_KEY || ''"
          DSH_MEMORY_AMEM_DIR: !!js "process.env.DSH_MEMORY_AMEM_DIR || ''"
        cwd: !!js process.cwd()
