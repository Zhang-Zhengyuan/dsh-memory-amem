# dsh-tool-memory-amem bundle patch: inserts the agentic memory plugin row
# into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
#
#   dsh plugin --profile web add link:<repo>
#
# One package, both halves: the node half (exports ".") runs in the host
# process and registers the model-facing memory_* tools plus a dynamic
# system-prompt section; the browser half (declared by `dsh.client`, served
# from lib/client.js) currently registers only a UI slot for the future
# memory panel — the standalone HTML panel in web/ is the immediate
# inspection surface for this v0.2.0.

- insert:
    - id: tool-memory-amem
      name: '@zhang-zhengyuan/dsh-tool-memory-amem'
